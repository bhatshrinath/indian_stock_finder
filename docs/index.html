<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock Finder India</title>
  <meta name="description" content="Daily swing-trade and long-term stock ideas for NSE, with stop-loss, targets, position sizing and a live track record.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stock Finder">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Stock Finder <small>India</small></span>
    </div>
    <div class="status" id="status" aria-live="polite">Loading…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" class="active">Today</button>
    <button role="tab" data-tab="swing">Swing</button>
    <button role="tab" data-tab="longterm">Long-term</button>
    <button role="tab" data-tab="record">Results</button>
    <button role="tab" data-tab="news">News</button>
    <button role="tab" data-tab="settings" aria-label="Settings">⚙</button>
  </nav>

  <main id="app">
    <section id="tab-today" class="tab active"></section>
    <section id="tab-swing" class="tab"></section>
    <section id="tab-longterm" class="tab"></section>
    <section id="tab-record" class="tab"></section>
    <section id="tab-news" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <dialog id="dlg"><div id="dlg-body"></div><form method="dialog"><button class="btn">Close</button></form></dialog>

  <footer class="foot" id="disclaimer"></footer>
  <script src="app.js"></script>
</body>
</html>
