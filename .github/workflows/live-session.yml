name: Live session

# Keeps live prices fresh all day: refreshes about every 2 minutes from 9:10 AM to 3:40 PM IST,
# checks stop-loss levels and sends alerts. GitHub's free scheduler can run late or skip runs,
# so it starts from several slots (the later ones only matter if an earlier one was missed),
# and you can also start it by hand: Actions > Live session > Run workflow.
on:
  schedule:
    - cron: "22 3 * * 1-5"    # 08:52 IST
    - cron: "52 3 * * 1-5"    # 09:22 IST
    - cron: "37 5 * * 1-5"    # 11:07 IST
    - cron: "52 8 * * 1-5"    # 14:22 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-session
  cancel-in-progress: false

jobs:
  session:
    # Kill switch: repository variable AUTO_RUN = off stops automatic runs (manual runs still work).
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RUN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh prices until the market closes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRADE_AMOUNT: ${{ vars.TRADE_AMOUNT }}
          SAFE_MODE: ${{ vars.SAFE_MODE }}
          MAX_OPEN_TRADES: ${{ vars.MAX_OPEN_TRADES }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m engine.live_session
      - name: Save the final state to the site
        if: always()
        run: |
          git config user.name "stock-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: live session end $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
