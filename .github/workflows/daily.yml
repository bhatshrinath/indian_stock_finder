name: Daily scan

# The evening scan: new suggestions, backtests, long-term list, alerts. It is started automatically at about 4:20 PM IST
# by the Live prices workflow (once the day's data is final), whenever the engine code changes, or by hand
# (Actions > Daily scan > Run workflow). The schedule lines are only a bonus: GitHub's scheduler does not fire here.
on:
  schedule:
    - cron: "47 12 * * 1-5"
    - cron: "27 13 * * 1-5"
    - cron: "7 15 * * 1-5"
  workflow_dispatch:
  # also refresh the published data whenever the engine code changes
  push:
    branches: [main]
    paths: ["engine/**", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  scan:
    # Kill switch: set repository variable AUTO_RUN = off to stop all automatic runs
    # (Settings -> Secrets and variables -> Actions -> Variables). Manual runs still work.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RUN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Skip a backup slot when today's scan already ran
        id: check
        run: |
          done=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today=$(date -u +%Y-%m-%d)
            if grep -Eq "\"generated\":\"${today}T(10:5[0-9]|1[1-9]|2[0-3])" docs/data/latest.json 2>/dev/null; then done=true; fi
          fi
          echo "done=$done" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.check.outputs.done != 'true'
      - name: Run full scan, backtests and recommendations
        if: steps.check.outputs.done != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRADE_AMOUNT: ${{ vars.TRADE_AMOUNT }}
          SAFE_MODE: ${{ vars.SAFE_MODE }}
          MAX_OPEN_TRADES: ${{ vars.MAX_OPEN_TRADES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_NOTES: ${{ vars.AI_NOTES }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m engine.run --mode full
      - name: Publish data
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "stock-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data engine/nifty200_fallback.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: daily scan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      # Long-term champions (Advanced screen) and the 18-year test of My Plan's methods (longtest.json):
      # ~19 years of prices, rebuilt about once a week. A separate step after the scan is published, so it
      # can never delay or break the daily plan.
      - name: Long-term champions study (weekly)
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: python -m engine.run --mode champions
      - name: Publish champions
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        run: |
          git add docs/data/champions.json docs/data/longtest.json 2>/dev/null || git add docs/data/champions.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: long-term champions $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
