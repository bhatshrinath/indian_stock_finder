name: Tests

on:
  push:
    paths: ["engine/**", "tests/**", "docs/*.js", "requirements.txt"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Data source diagnostics (visible as notes on the run page)
        continue-on-error: true
        run: python -m engine.diagnose
      - name: Safe-strategy robustness study on real data (visible as a note on the run page)
        continue-on-error: true
        run: python -m engine.research
      - name: Long-history strategy study, ~18 years (only when the commit message contains [study])
        if: contains(github.event.head_commit.message, '[study]')
        continue-on-error: true
        timeout-minutes: 25
        run: python -m engine.study
      - name: End-to-end run on synthetic data
        run: python -m engine.run --mode full --demo --no-news
      - name: Long-term champions study on synthetic data
        run: python -m engine.run --mode champions --demo --no-news
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check docs/app.js && node --check docs/sw.js
