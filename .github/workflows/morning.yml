name: Morning reminder

# 08:45 IST = 03:15 UTC, Mon-Fri: today's buy ideas, 30 minutes before the market opens.
# Sends only if an alert channel is set up (NTFY_TOPIC / Telegram / Gmail secrets).
on:
  schedule:
    - cron: "15 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    # Kill switch: repository variable AUTO_RUN = off stops automatic runs.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RUN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send pre-market reminder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TRADE_AMOUNT: ${{ vars.TRADE_AMOUNT }}
          SAFE_MODE: ${{ vars.SAFE_MODE }}
          MAX_OPEN_TRADES: ${{ vars.MAX_OPEN_TRADES }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m engine.run --mode morning
