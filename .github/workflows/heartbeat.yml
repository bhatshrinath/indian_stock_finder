name: Scheduler heartbeat

# Temporary diagnostic: if this shows runs every ~10 minutes, GitHub's scheduler works for this repository.
# (Delete this file once the scheduled workflows are confirmed to run.)
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "scheduler is alive at $(date -u)"
